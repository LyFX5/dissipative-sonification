[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dissipative_sonification"
version = "0.1.0"
description = "An interactive animation and audiation of dissipative system"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "The Simulations Can Teach Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.3",
    "scipy>=1.10.0",
    "tqdm>=4.0",
    "matplotlib>=3.7.0",
    "sounddevice>=0.4.6"
]
requires-python = ">=3.8"

[project.optional-dependencies]
ui = [
    "dash>=2.14",
    "plotly>=5",
]

[project.urls]
Homepage = "https://github.com/LyFX5/dissipative-sonification"
Repository = "https://github.com/LyFX5/dissipative-sonification"
